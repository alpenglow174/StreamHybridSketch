# Federated Sketches streaming stack (separate from the hadoop-lab container).
#   docker compose up -d kafka influxdb grafana app      # infrastructure + toolbox
#   docker compose --profile pipeline up                  # live federated pipeline
name: fedsketch

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: fedsketch-app:1.0
  volumes:
    - ./:/app
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    INFLUX_HOST: influxdb
    PIPELINE_CONFIG: /app/pipeline/config.json

x-edge: &edge
  <<: *app
  profiles: ["pipeline"]
  depends_on: [fl-server]
  command: python -m pipeline.edge_client

services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]

  influxdb:
    image: influxdb:1.8.10
    environment:
      INFLUXDB_DB: fedsketch
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports: ["8086:8086"]
    volumes: [influx-data:/var/lib/influxdb]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fedsketch.json
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on: [influxdb]

  # long-lived toolbox for experiments: docker compose exec app python -m experiments.<name>
  app:
    <<: *app
    command: sleep infinity
    depends_on: [kafka, influxdb]

  # ---------------- live pipeline (profile "pipeline") ----------------
  topics:          # one-shot: (re)create Kafka topics before anything subscribes
    <<: *app
    profiles: ["pipeline"]
    command: python -m pipeline.producer --create-topics
    depends_on: [kafka]

  producer:
    <<: *app
    profiles: ["pipeline"]
    command: python -m pipeline.producer
    depends_on:
      topics: {condition: service_completed_successfully}

  oracle:
    <<: *app
    profiles: ["pipeline"]
    command: python -m pipeline.oracle
    depends_on:
      topics: {condition: service_completed_successfully}

  fl-server:
    <<: *app
    profiles: ["pipeline"]
    hostname: fl-server
    command: python -m pipeline.fl_server
    depends_on:
      topics: {condition: service_completed_successfully}

  edge-0: {<<: *edge, environment: {EDGE_ID: "0", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-1: {<<: *edge, environment: {EDGE_ID: "1", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-2: {<<: *edge, environment: {EDGE_ID: "2", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-3: {<<: *edge, environment: {EDGE_ID: "3", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-4: {<<: *edge, environment: {EDGE_ID: "4", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-5: {<<: *edge, environment: {EDGE_ID: "5", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-6: {<<: *edge, environment: {EDGE_ID: "6", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}
  edge-7: {<<: *edge, environment: {EDGE_ID: "7", KAFKA_BOOTSTRAP: "kafka:9092", PIPELINE_CONFIG: /app/pipeline/config.json}}

volumes:
  kafka-data:
  influx-data:
